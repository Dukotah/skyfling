<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skyfling">
<meta name="theme-color" content="#1f2a44">
<title>Skyfling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1f2a44;--navy2:#2a3762;--ink:#141b2e;--butter:#ffd23f;--coral:#ff6b4a;--mint:#5fd3b5;--paper:#f3ecdf;--muted:#9aa6c4;
  --glass:rgba(14,20,38,.52);--line:rgba(255,255,255,.12);
  --display:'Bungee','Arial Black',Impact,sans-serif;--body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#1f2a44;--ink:#141b2e;--paper:#f3ecdf;--muted:#9aa6c4}}
:root[data-theme="dark"]{--navy:#1f2a44;--ink:#141b2e;--paper:#f3ecdf;--muted:#9aa6c4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--ink);color:var(--paper);font-family:var(--body);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;touch-action:none;display:block}
.hidden{display:none!important}
button{cursor:pointer;font-family:var(--body);transition:transform .08s ease}
button:active:not(:disabled){transform:scale(.96)}
button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.coin-ic{width:18px;height:18px;border-radius:50%;display:inline-block;flex:none;
  background:radial-gradient(circle at 35% 32%,#fffbe0,#ffd23f 42%,#d99a10 100%);box-shadow:inset 0 0 0 2px #b97f06,0 1px 0 rgba(0,0,0,.25)}
.coin-ic.lg{width:34px;height:34px;box-shadow:inset 0 0 0 3px #b97f06}

/* screen fx */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(8,12,28,.42) 100%)}
#lines{position:absolute;inset:-25%;opacity:0;
  background:repeating-conic-gradient(from 0deg at 50% 50%,transparent 0deg 2.4deg,rgba(255,255,255,.6) 2.4deg 2.75deg,transparent 2.75deg 7deg);
  -webkit-mask:radial-gradient(circle at center,transparent 26%,#000 58%);mask:radial-gradient(circle at center,transparent 26%,#000 58%)}
#storm{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,rgba(50,58,90,.2) 25%,rgba(14,18,34,.88) 100%)}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(var(--st) + 10px) calc(var(--sr) + 12px) 0 calc(var(--sl) + 12px)}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dist{font-family:var(--display);font-size:46px;line-height:.95;color:#fff;font-variant-numeric:tabular-nums;
  text-shadow:0 3px 0 rgba(20,27,46,.55),0 0 22px rgba(20,27,46,.25)}
.dist small{font-size:20px;margin-left:3px}
.bestbar{position:relative;margin-top:7px;width:min(196px,48vw);height:17px;border-radius:9px;background:var(--glass);overflow:hidden;
  border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#hBestFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(255,210,63,.45),var(--butter))}
#hBestTxt{position:relative;display:block;text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.08em;line-height:15px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.bestbar.beat #hBestFill{background:linear-gradient(90deg,var(--mint),#b6ffe9)}
.bestbar.beat #hBestTxt{color:var(--ink);text-shadow:none}
.mtrack{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.mt{display:flex;align-items:center;gap:7px;background:var(--glass);border-radius:10px;padding:4px 9px 4px 6px;font-size:11.5px;font-weight:700;color:#fff;
  width:min(236px,58vw);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1);transition:background .3s}
.mt i{font-style:normal;width:18px;text-align:center;flex:none}
.mt span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt b{font-variant-numeric:tabular-nums;color:var(--butter);flex:none}
.mt.done{background:rgba(95,211,181,.92);color:var(--ink);border-color:transparent}
.mt.done b{color:var(--ink)}
.hud-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--glass);padding:6px 12px 6px 8px;border-radius:999px;font-weight:800;font-size:18px;color:#fff;
  font-variant-numeric:tabular-nums;border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.chip{white-space:nowrap;background:var(--glass);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.chip.combo{background:linear-gradient(135deg,var(--coral),#ff9a6a);color:#fff;font-family:var(--display);font-size:13px}
.chip.combo.pop{animation:cpop .2s ease-out}
@keyframes cpop{50%{transform:scale(1.18)}}
.chip.ghost{background:rgba(154,208,255,.22);color:#dff1ff;border:1px solid rgba(154,208,255,.4)}
.chip.star{background:linear-gradient(135deg,#ffe066,#ffb02e);color:var(--ink)}
.chip.warn{background:rgba(70,78,120,.85);color:#e6ecff;animation:blink 1s ease-in-out infinite}
.iconbtn{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:var(--glass);color:#fff;font-size:15px;font-weight:800;
  display:grid;place-items:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.gauges{position:absolute;left:calc(var(--sl) + 14px);bottom:calc(var(--sb) + 22px)}
.gauge{display:flex;align-items:center;gap:8px}
.gl{font-size:10px;font-weight:800;letter-spacing:.12em;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.gbar{width:min(150px,36vw);height:11px;border-radius:6px;background:var(--glass);overflow:hidden;border:1px solid rgba(255,255,255,.3)}
#hFuel{height:100%;width:100%;background:linear-gradient(90deg,var(--coral),var(--butter))}
.gauge.low .gbar{animation:blink .5s steps(2) infinite}
#hint{position:absolute;left:0;right:0;bottom:calc(var(--sb) + 132px);text-align:center;font-weight:800;font-size:16px;color:#fff;
  text-shadow:0 2px 6px rgba(0,0,0,.6);padding:0 24px;transition:opacity .4s}
#toast{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:var(--display);font-size:24px;color:#fff;letter-spacing:.02em;
  text-shadow:0 3px 0 var(--ink),0 0 18px rgba(20,27,46,.5);opacity:0;transition:opacity .45s,transform .45s;transform:translateY(8px);padding:0 16px}
#toast.on{opacity:1;transform:none}
#callout{position:absolute;left:0;right:0;top:27%;text-align:center;font-family:var(--display);font-size:clamp(36px,11vw,62px);line-height:1;
  color:var(--butter);text-shadow:0 5px 0 var(--ink),0 0 30px rgba(255,210,63,.6);opacity:0;pointer-events:none;padding:0 10px}
#callout.mint{color:var(--mint);text-shadow:0 5px 0 var(--ink),0 0 30px rgba(95,211,181,.6)}
#callout.go{animation:pop 1.25s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-6deg)}14%{opacity:1;transform:scale(1.14) rotate(2deg)}24%{transform:scale(1) rotate(0)}74%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-22px) scale(.96)}}
#banner{position:absolute;left:50%;bottom:calc(var(--sb) + 128px);transform:translate(-50%,20px);opacity:0;transition:opacity .3s,transform .35s cubic-bezier(.2,1.4,.4,1);
  display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--mint),#8ff0d6);color:var(--ink);font-weight:800;font-size:14px;
  padding:9px 14px;border-radius:14px;box-shadow:0 5px 0 rgba(20,27,46,.4);width:max-content;max-width:min(340px,82vw)}
#banner.on{opacity:1;transform:translate(-50%,0)}
#banner b{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
#banner b .coin-ic{width:15px;height:15px}

/* power meter */
.pmeter{position:absolute;right:calc(var(--sr) + 18px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
.ptrack{position:relative;width:28px;height:min(250px,40vh);border-radius:15px;background:var(--glass);border:2px solid rgba(255,255,255,.6);overflow:hidden;
  box-shadow:0 4px 0 rgba(20,27,46,.4)}
#pFill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,#3fb596,var(--mint) 60%,#c6fff0)}
#pZone{position:absolute;left:0;right:0;background:rgba(255,210,63,.32);border-top:2px solid var(--butter);border-bottom:2px solid var(--butter);z-index:2;
  box-shadow:0 0 14px rgba(255,210,63,.7)}
#pZone.hot{background:rgba(255,210,63,.9);box-shadow:0 0 22px #ffd23f}
.pmeter.hot #pFill{background:linear-gradient(0deg,#e6a800,var(--butter) 60%,#fff6c4)}
.plabel{font-family:var(--display);font-size:11px;color:#fff;text-shadow:0 2px 0 var(--ink)}
.pstreak{font-size:11px;font-weight:800;color:var(--butter);text-shadow:0 1px 3px rgba(0,0,0,.6);min-height:14px}

/* boost */
.boost{position:absolute;right:calc(var(--sr) + 16px);bottom:calc(var(--sb) + 20px);width:96px;height:96px;border-radius:50%;border:0;padding:6px;
  pointer-events:auto;touch-action:none;background:conic-gradient(var(--mint) calc(var(--n,0) * 1turn),rgba(255,255,255,.16) 0);
  box-shadow:0 6px 0 rgba(20,27,46,.45),0 0 0 1px rgba(255,255,255,.15)}
.boost .in{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 36% 28%,#44568c,var(--ink) 75%);display:grid;place-items:center;align-content:center;
  color:#fff;font-family:var(--display);font-size:12px;letter-spacing:.04em}
.boost .in i{font-style:normal;font-size:30px;line-height:1.05}
.boost.on{transform:scale(.93)}
.boost.on .in{background:radial-gradient(circle at 36% 28%,#fff6c4,var(--butter) 70%);color:var(--ink)}
.boost.empty{opacity:.5}
.boost.full{animation:glow 1.3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 6px 0 rgba(20,27,46,.45),0 0 0 6px rgba(95,211,181,.35),0 0 24px rgba(95,211,181,.6)}}
@keyframes blink{50%{opacity:.45}}

/* Hangar */
#hangar{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
#hangar>*{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:calc(var(--st) + 16px) calc(var(--sr) + 16px) 0 calc(var(--sl) + 16px);pointer-events:none!important}
.logo{font-family:var(--display);font-size:clamp(38px,11.5vw,62px);line-height:.88;color:var(--butter);transform:rotate(-5deg);transform-origin:left bottom;
  text-shadow:0 4px 0 var(--coral),0 8px 0 var(--ink),0 0 30px rgba(20,27,46,.3)}
.logo span{display:block;color:#fff;text-shadow:0 4px 0 var(--mint),0 8px 0 var(--ink)}
.stats{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.small{font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.chest{pointer-events:auto;border:0;border-radius:999px;background:var(--glass);color:#fff;font-weight:800;font-size:13px;padding:7px 12px 7px 9px;
  display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.chest em{font-style:normal;font-size:17px;line-height:1}
.chest.ready{background:linear-gradient(135deg,var(--butter),#ffae2b);color:var(--ink);border-color:transparent;box-shadow:0 4px 0 #b97f06;animation:wiggle 2.6s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-6deg) scale(1.05)}88%{transform:rotate(6deg) scale(1.05)}92%{transform:rotate(-3deg)}}
.sheet{background:linear-gradient(180deg,#2a3866,var(--navy) 120px);border-radius:26px 26px 0 0;max-height:64%;display:flex;flex-direction:column;gap:10px;
  padding:14px calc(var(--sr) + 16px) calc(var(--sb) + 14px) calc(var(--sl) + 16px);border-top:1px solid rgba(255,255,255,.14);box-shadow:0 -10px 30px rgba(10,14,30,.35)}
.grab{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:-4px auto 0}
.plane-name{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.plane-name b{font-family:var(--display);font-weight:400;font-size:21px;color:#fff}
.plane-name span{font-size:12.5px;color:var(--muted);text-align:right;font-weight:600}
.evo{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:-4px}
#evoFill{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--butter));border-radius:3px;transition:width .4s}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:rgba(0,0,0,.25);padding:4px;border-radius:14px}
.tabs button{border:0;background:none;color:var(--muted);font-weight:800;font-size:14px;padding:8px 4px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button.on{background:rgba(255,255,255,.13);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.tabs b{background:var(--coral);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px;min-height:0;flex:1;overscroll-behavior:contain;padding-bottom:2px}
.row{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;background:rgba(255,255,255,.05);border-radius:15px;padding:8px;border:1px solid transparent;transition:border-color .2s,background .2s}
.row.can{border-color:rgba(255,210,63,.35);background:rgba(255,210,63,.06)}
.ic{width:46px;height:46px;border-radius:13px;background:linear-gradient(160deg,#2b3a68,var(--ink));display:grid;place-items:center;font-size:23px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.nm{font-weight:800;font-size:15.5px;color:#fff;line-height:1.2}
.nm em{font-style:normal;font-weight:700;color:var(--butter);font-size:12px;margin-left:6px}
.ds{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.3}
.pips{display:flex;gap:3px;margin-top:6px}
.pips i{flex:1;max-width:16px;height:5px;border-radius:3px;background:rgba(255,255,255,.14)}
.pips i.on{background:linear-gradient(90deg,var(--butter),#ffb02e)}
.buy{border:0;border-radius:12px;background:linear-gradient(180deg,#ffe066,var(--butter));color:var(--ink);font-weight:800;font-size:15px;padding:10px 12px;min-width:86px;
  display:flex;align-items:center;gap:6px;justify-content:center;box-shadow:0 3px 0 #b98a06;font-variant-numeric:tabular-nums}
.buy .coin-ic{width:14px;height:14px}
.buy:disabled{background:rgba(255,255,255,.09);color:var(--muted);cursor:default;box-shadow:none}
.buy:disabled .coin-ic{opacity:.45}
.buy.eq:disabled{background:rgba(95,211,181,.18);color:var(--mint)}
.rew{display:flex;align-items:center;gap:5px;font-weight:800;color:var(--butter);font-size:15px;padding-right:4px}
.rew .coin-ic{width:15px;height:15px}
.mhead{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;padding:2px 2px 0}
.mnote{font-size:12px;color:var(--muted);text-align:center;padding:4px 8px 2px;line-height:1.4}
.sw{width:46px;height:46px;border-radius:13px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.sw i{display:block}
.prow{cursor:pointer}
.prow.pv{border-color:var(--mint);background:rgba(95,211,181,.08)}
.fly{border:0;border-radius:17px;background:linear-gradient(180deg,#ff8466,var(--coral));color:#fff;font-family:var(--display);font-size:25px;padding:14px;
  box-shadow:0 5px 0 #b8432c,0 10px 20px rgba(255,107,74,.25);letter-spacing:.03em;text-shadow:0 2px 0 rgba(140,40,20,.4)}
.fly:active{transform:translateY(3px);box-shadow:0 2px 0 #b8432c}
.foot{display:flex;justify-content:space-between}
.link{background:none;border:0;color:var(--muted);font-weight:700;font-size:13px;padding:4px}
@media (orientation:landscape) and (max-height:560px){
  #hangar{flex-direction:row;align-items:stretch}
  .top{flex:1;flex-direction:column}
  .stats{align-items:flex-start;text-align:left}
  .sheet{border-radius:26px 0 0 26px;width:400px;max-height:none;height:100%;padding-top:calc(var(--st) + 14px)}
  .grab{display:none}
}

/* Modals */
.modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(14,19,36,.5);padding:20px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.card{position:relative;background:linear-gradient(180deg,#2a3866,var(--navy) 140px);border-radius:24px;padding:22px 20px 20px;width:min(370px,100%);text-align:center;
  border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 0 rgba(14,19,36,.55),0 20px 50px rgba(0,0,0,.35);animation:rise .4s cubic-bezier(.2,1.35,.4,1)}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
.badge{position:absolute;left:50%;top:-14px;transform:translateX(-50%) rotate(-3deg);background:var(--butter);color:var(--ink);font-family:var(--display);font-size:14px;
  padding:5px 14px;border-radius:10px;box-shadow:0 4px 0 #b98a06;white-space:nowrap}
.card h2{font-family:var(--display);font-weight:400;font-size:24px;color:var(--butter);text-shadow:0 3px 0 var(--ink)}
.big{font-family:var(--display);font-size:58px;color:#fff;line-height:1.05;margin:4px 0 2px;font-variant-numeric:tabular-nums;text-shadow:0 4px 0 var(--ink)}
.big small{font-size:22px}
.sub{font-size:13.5px;color:var(--muted);font-weight:600;margin-bottom:14px}
.sub.good{color:var(--mint)}
.lines{text-align:left;display:flex;flex-direction:column;gap:7px;margin-bottom:12px;font-size:15px;background:rgba(0,0,0,.18);border-radius:14px;padding:12px 14px}
.lines div{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.lines .tot{border-top:2px solid rgba(255,255,255,.12);padding-top:9px;margin-top:2px;font-weight:800;color:var(--butter);font-size:18px}
.lines span{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.mdone{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.mdone:empty{display:none}
.md{display:flex;align-items:center;gap:8px;background:rgba(95,211,181,.14);border:1px solid rgba(95,211,181,.35);border-radius:12px;padding:7px 10px;font-size:13px;font-weight:700;text-align:left}
.md i{font-style:normal;color:var(--ink);background:var(--mint);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none}
.md span{flex:1}
.md b{color:var(--butter);white-space:nowrap}
.btns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.sec{border:0;border-radius:16px;background:rgba(255,255,255,.1);color:#fff;font-weight:800;font-size:16px;padding:12px 8px}
.btns .fly{font-size:20px}
.chestic{font-size:74px;line-height:1;margin:2px 0 6px;display:inline-block;filter:drop-shadow(0 6px 0 rgba(14,19,36,.5))}
.chestic.shake{animation:cshake .6s ease-in-out infinite}
.chestic.open{animation:copen .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes cshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes copen{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(-6deg)}100%{transform:scale(1.15)}}
.streak{display:flex;justify-content:center;gap:6px;margin:10px 0 12px}
.streak i{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:var(--muted)}
.streak i.on{background:var(--butter);color:var(--ink)}
.streak i.now{box-shadow:0 0 0 2px #fff}
.camt{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-size:42px;color:#fff;text-shadow:0 4px 0 var(--ink);margin-bottom:6px}
.note{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.4}
.note b{color:#fff}
@media (prefers-reduced-motion:reduce){#toast,#hint,#banner{transition:none}.chest.ready,.boost.full,.chip.warn{animation:none}}
#joy{position:fixed;left:0;top:0;width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,.45);background:rgba(14,20,38,.18);display:none;pointer-events:none}
#knob{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,rgba(255,255,255,.6));box-shadow:0 3px 8px rgba(0,0,0,.3)}
#fail{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;font-weight:800}

/* ---------- world ---------- */
const BIOMES=[

const BL=1200,WATER_Y=-26;
function biomeAt(d){
  const i=Math.max(0,Math.floor(d/BL)),f=(d-i*BL)/BL;

    amp:L('amp'),rough:L('rough'),basin:L('basin'),water:L('water'),lava:L('lava'),night:L('night'),th:L('th'),bal:L('bal'),props:t<.5?a.props:b.props,name:t<.5?a.name:b.name,idx:t<.5?i:i+1};

function groundY(x,z){
  const d=-z,t=clamp((d-30)/250,0,1),side=clamp((Math.abs(x)-10)/80,0,1),w=Math.max(t,side*.6);

const LAUNCH={x:0,y:9,z:0};

/* ---------- materials & shared geo ---------- */

const MAT={coral:PH(0xff6b4a),butter:PH(0xffd23f),mint:PH(0x5fd3b5),paper:PH(0xf6f3ea),ink:PH(0x1b2236),wood:PH(0x6b4428),

    for(let k=0;k<4;k++){const fg=new THREE.Group();fg.add(box(.12,1.6,1.4,PM.a,0,1.2,2.6));fg.rotation.z=k*Math.PI/2+Math.PI/4;g.add(fg);}

function simStep(q,dt,pin,sin){

  q.thrusting=thrust>0;
  const at=clamp(.02+(q.s-1.3*S.stall)*.003,-.03,.2),assist=(1-Math.abs(pin))*.9*liftF;
  q.a+=(at-q.a)*assist*dt+pin*S.turn*dt*(.45+.55*liftF)-(1-liftF)*1.2*dt;q.a=clamp(q.a,-1.45,1.45);

  q.roll+=(-sin*.75-q.roll)*Math.min(1,dt*6);
  q.s+=(-G*Math.sin(q.a)-S.drag*q.s*q.s+thrust-Math.abs(sin)*.5)*dt;
  if(q.onGround)q.s-=(6+.002*q.s*q.s)*dt;
  if(q.s<1)q.s=1;
  q.vy=q.s*Math.sin(q.a)*(.4+.6*liftF)-(q.s/S.gr+1.5)*liftF-(1-liftF)*7;
  const h=q.s*Math.cos(q.a);
  q.x+=-Math.sin(q.yaw)*h*dt;q.z+=-Math.cos(q.yaw)*h*dt;q.y+=q.vy*dt;
}

    const fx=-Math.sin(q.yaw),fz=-Math.cos(q.yaw);
    const slope=water?0:Math.atan2(groundY(q.x+fx,q.z+fz)-groundY(q.x-fx,q.z-fz),2);

        crash(lava);return;

    }

function updateCam(dt){
  const land=W>H&&H<=560;
  let tp,tl,fov=60;
  if(state==='hangar'){
    const ang=T*.25;tp=new THREE.Vector3(p.x+Math.sin(ang)*19,p.y+3.5,p.z+Math.cos(ang)*19);tl=new THREE.Vector3(p.x,p.y,p.z);
    if(land)camera.setViewOffset(W,H,W*.2,0,W,H);else camera.setViewOffset(W,H,0,H*.24,W,H);
  }else{
    camera.clearViewOffset();
    const yaw=p.yaw,f=fwd(yaw,0);
    if(state==='aim'){tp=new THREE.Vector3(LAUNCH.x-f.x*21,LAUNCH.y+8,LAUNCH.z-f.z*21);tl=new THREE.Vector3(LAUNCH.x+f.x*30,LAUNCH.y+5,LAUNCH.z+f.z*30);}
    else{
      const back=16+Math.min(10,p.s*.06)+(p.boosting?3:0);
      tp=new THREE.Vector3(p.x-f.x*back,p.y+4.2-Math.sin(p.a)*5,p.z-f.z*back);
      tl=new THREE.Vector3(p.x+f.x*14,p.y+Math.sin(p.a)*8+1,p.z+f.z*14);
      fov=60+Math.min(22,p.s*.18)+(p.boosting?10:0);
      if(state==='over'&&!p.alive){const ang=T*.3;tp=new THREE.Vector3(p.x+Math.sin(ang)*22,p.y+9,p.z+Math.cos(ang)*22);tl=new THREE.Vector3(p.x,p.y,p.z);}
    }
  }
  const k=1-Math.exp(-dt*(state==='fly'?6:3));
  camPos.lerp(tp,k);camLook.lerp(tl,k);
  const cg=groundY(camPos.x,camPos.z)+2;if(camPos.y<cg)camPos.y=cg;
  camera.position.copy(camPos);
  if(shake>0){const s=shake*shake*1.4;camera.position.x+=rnd(-s,s);camera.position.y+=rnd(-s,s);shake=Math.max(0,shake-dt*2);}
  camera.lookAt(camLook);
  camera.fov+=(fov-camera.fov)*Math.min(1,dt*3);camera.updateProjectionMatrix();
}

function countUp(){

function endRun(){
  state='over';boostHeld=false;boostEl.classList.add('hidden');$('pauseBtn').classList.add('hidden');$('hStorm').classList.add('hidden');setHint('');
  const d=Math.floor(dist());run.dist=d;
  const bonus=Math.floor(d/8),landing=(crashed||bailed)?0:Math.round((runCoins+bonus)*.15);
  save.missions.forEach((m,i)=>{if(!run.done.includes(i)&&MDEF[m.t].end&&MDEF[m.t].v()>=m.n)run.done.push(i);});
  const mis=run.done.map(i=>save.missions[i]),misT=mis.reduce((a,m)=>a+m.r,0);
  const storm=run.broke.reduce((a,k)=>a+FBONUS(k),0);
  const total=runCoins+bonus+landing+misT+storm,prev=save.best,nb=d>prev&&d>0;
  save.coins+=total;if(nb){save.best=d;if(ghostRec.length>8){save.ghost=ghostRec;save.ghostTier=planeTier;}}save.runs++;
  if(mis.length){save.mlv+=mis.length;const nm=save.missions.map((m,i)=>run.done.includes(i)?null:m);
    for(let i=0;i<3;i++)if(!nm[i])nm[i]=genMission(nm.filter(Boolean).map(x=>x.t));save.missions=nm;}
  persist();
  $('oBadge').classList.toggle('hidden',!(nb&&prev>0));
  $('oTitle').textContent=nb?(prev>0?'New best!':'Nice first flight'):bailed?'Flight ended':crashed?'Crashed!':'Clean landing';
  $('oDist').dataset.v=d;
  const sub=$('oSub');sub.className='sub'+(nb?' good':'');
  sub.textContent=nb&&prev>0?`+${fmt(d-prev)} m past your old best`:prev>0?`${fmt(prev-d)} m short of your best (${fmt(prev)} m)`:'Spend those coins and go again';
  const line=(k,v,cls='')=>`<div class="${cls}"><span>${k}</span><span><i class="coin-ic"></i><b data-v="${v}">0</b></span></div>`;
  $('oLines').innerHTML=line('Coins collected',runCoins)+line('Distance bonus',bonus)+(landing?line('Landing bonus',landing):'')
    +(misT?line('Missions',misT):'')+(storm?line('Storm breaker',storm):'')+(run.comboBonus?line('Combo bonus',run.comboBonus):'')+line('Total earned',total,'tot');
  $('oMis').innerHTML=mis.map(m=>`<div class="md"><i>✓</i><span>${MDEF[m.t].t(m.n)}</span><b>+${fmt(m.r)}</b></div>`).join('')
    +run.broke.map(k=>`<div class="md"><i>⛈</i><span>Broke storm front #${k+1}</span><b>+${fmt(FBONUS(k))}</b></div>`).join('');
  $('over').classList.remove('hidden');countUp();
  if(nb&&prev>0)sfx('best');
}
$('flyBtn').addEventListener('click',startAim);$('againBtn').addEventListener('click',startAim);$('upBtn').addEventListener('click',showHangar);
$('sndBtn').addEventListener('click',()=>{save.sound=!save.sound;persist();if(save.sound)audioInit();else if(engGain)engGain.gain.value=0;renderHangar();});
$('invBtn').addEventListener('click',()=>{save.invert=!save.invert;persist();renderHangar();});
let rstArm=false,rstTO=null;
$('rstBtn').addEventListener('click',()=>{
  if(!rstArm){rstArm=true;$('rstBtn').textContent='Tap again to wipe';clearTimeout(rstTO);rstTO=setTimeout(()=>{rstArm=false;$('rstBtn').textContent='Reset';},3000);return;}
  rstArm=false;$('rstBtn').textContent='Reset';
  Object.assign(save,{coins:0,best:0,runs:0,missions:null,ghost:null,ghostTier:0,mlv:0,skin:'classic',skins:['classic'],chestDay:'',chestStreak:0,perfStreak:0,fronts:0});
  UPG.forEach(u=>save.lv[u.id]=0);previewSkin=null;persist();newRun();renderHangar();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();if(ac)ac.suspend();}else if(ac&&save.sound)ac.resume();});

/* ---------- boot ---------- */
ensureMissions();setPlaneTier();newRun();renderHangar();
let last=performance.now();
function loop(now){
  const rd=Math.min(.033,Math.max(0,(now-last)/1000));last=now;
  if(slowmo>0){slowmo-=rd;timeScale=.3;}else timeScale=Math.min(1,timeScale+rd*2.5);
  if(!paused)update(rd*timeScale);
  renderer.render(scene,camera);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();

</script>
